<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CFG bundle (case 122)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #111; color: #eee; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 18px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
    button { padding: 8px 12px; border-radius: 8px; border: 0; background: #2b6cb0; color: #fff; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
    input[type=range] { width: 320px; }
    .meta { opacity: 0.8; font-size: 14px; }
    .frame { background: #000; border-radius: 12px; overflow: hidden; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <button id="btn">Play</button>
      <input id="slider" type="range" min="0" max="11" value="0" step="1"/>
      <span class="meta">FPS: <b>6</b> | Frame: <b id="idx">0</b> / 11</span>
    </div>
    <div class="frame">
      <img id="img" src="frame_000.png" alt="animation frame"/>
    </div>
  </div>
  <script>
    const frames = ['frame_000.png', 'frame_001.png', 'frame_002.png', 'frame_003.png', 'frame_004.png', 'frame_005.png', 'frame_006.png', 'frame_007.png', 'frame_008.png', 'frame_009.png', 'frame_010.png', 'frame_011.png'];
    const fps = 6;
    const img = document.getElementById('img');
    const slider = document.getElementById('slider');
    const idxText = document.getElementById('idx');
    const btn = document.getElementById('btn');
    let timer = null;

    function setFrame(i) {
      const idx = Math.max(0, Math.min(frames.length-1, i));
      slider.value = idx;
      idxText.textContent = idx;
      img.src = frames[idx];
    }

    slider.addEventListener('input', (e) => {
      setFrame(parseInt(e.target.value));
    });

    function play() {
      if (timer) return;
      btn.textContent = 'Pause';
      timer = setInterval(() => {
        const i = (parseInt(slider.value) + 1) % frames.length;
        setFrame(i);
      }, Math.round(1000 / fps));
    }

    function pause() {
      if (!timer) return;
      clearInterval(timer);
      timer = null;
      btn.textContent = 'Play';
    }

    btn.addEventListener('click', () => {
      if (timer) pause(); else play();
    });
  </script>
</body>
</html>
